name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs on release-please's own pull request and syncs the root marketplace
  # manifest into it, so one merge lands one consistent state. Deliberately NOT
  # `needs: release` — coupling the two meant a failed release job skipped the
  # sync entirely, which is exactly what happened on the first real run.
  sync-marketplace:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    concurrency:
      group: sync-marketplace-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Derive marketplace versions
        run: node scripts/sync-marketplace.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain .claude-plugin/marketplace.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .claude-plugin/marketplace.json
            git commit -m "chore: sync marketplace versions"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify the release PR is internally consistent
        run: node scripts/validate.mjs
