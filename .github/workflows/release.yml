name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-marketplace:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: sync-marketplace-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Derive marketplace versions
        run: node scripts/sync-marketplace.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain .claude-plugin/marketplace.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .claude-plugin/marketplace.json
            git commit -m "chore: sync marketplace versions"
            git push origin HEAD:main
          fi
      # validate.yml's own run on this push saw main mid-release: the plugin
      # manifests were bumped but marketplace.json was not yet synced, so it
      # failed on drift. The sync commit above is pushed with GITHUB_TOKEN and
      # raises no event, so nothing re-runs it. This step is the authoritative
      # check on the state main is actually left in.
      - name: Verify main is consistent after sync
        run: node scripts/validate.mjs
